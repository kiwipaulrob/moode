# SendSpin ALSA Configuration - Release 2
# 
# This file is managed by spspre.sh hook script.
# The hook will rewrite this file based on CamillaDSP state:
#   - DSP enabled:  routes through hw:Loopback for CamillaDSP processing
#   - DSP disabled: routes direct to hardware (Release 1 behaviour)
#
# Buffer tuning for sync precision:
#   period_time 1160  - ~25Hz at 48kHz, allows precise sample adjustment
#   buffer_time 4640  - 4 periods, balances latency vs stability
#
# These values allow SendSpin's Kalman filter to slip individual samples
# without ALSA's buffer getting in the way.

pcm.sendspin {
    type plug
    slave {
        pcm {
            type hw
            card 0
            device 0
        }
        period_time 1160
        buffer_time 4640
    }
}

